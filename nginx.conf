server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next's static export writes /en/properties.html, not
    # /en/properties/index.html, so a bare path must fall back to the
    # .html file before 404ing. Without this every clean URL 404s.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # Hashed build assets are immutable — cache them hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML must revalidate, otherwise a redeploy won't reach browsers
    # that already have the old page cached.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
